{% extends "layouts/base.html" %} {% block title %}Trang đăng nhập{% endblock %}
{% block content %}
<link href="/static/css/doctor/layouts/base.css" rel="stylesheet" />
<div class="doctorBasePageContainer">
  <div class="doctorBaseSideNavigation">
    <a
      href="/doctor/profile"
      class="doctorBaseSideNavigationItem {% if request.path == '/doctor/profile' %} doctorBaseSideNavigationItemActive {% endif %}"
    >
      <img
        src="/static/assets/users/user{% if request.path == '/doctor/profile' %}_active{% endif %}.svg"
        class="doctorBaseImage"
      />
      <div
        class="doctorBaseItemTitle {% if request.path == '/doctor/profile' %} doctorBaseItemTitleActive {% endif %}"
      >
        Hồ sơ
      </div>
    </a>
    <a
      href="/appointment/doctor"
      class="doctorBaseSideNavigationItem {% if request.path == '/appointment/doctor' %} doctorBaseSideNavigationItemActive {% endif %}"
    >
      <img
        src="/static/assets/calenders/calender{% if request.path == '/appointment/doctor' %}_active{% endif %}.svg"
        class="doctorBaseImage"
      />
      <div
        class="doctorBaseItemTitle {% if request.path == '/appointment/doctor' %} doctorBaseItemTitleActive {% endif %}"
      >
        Lịch làm
      </div>
    </a>
  </div>
  {% block main %}{% endblock %}
</div>
{% endblock %}
